<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About — DECIPHART</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cinzel', serif;
            background-color: #0c0f0e;
            color: #F1F5F9;
            line-height: 1.8;
            padding-top: 100px;
            background-image: radial-gradient(circle at 50% 0%, #151c19 0%, #0c0f0e 70%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* NAVIGATION MOBILE & DESKTOP */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(12, 15, 14, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(229, 184, 105, 0.4);
            z-index: 9999;
            padding: 15px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
        }

        .nav-link {
            color: #F1F5F9;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: #E5B869;
            text-shadow: 0 0 10px rgba(229, 184, 105, 0.6);
        }

        /* BOUTON BURGER (CACHE SUR DESKTOP) */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #E5B869;
            font-size: 1.8rem;
            cursor: pointer;
            line-height: 1;
        }

        /* CARTE DE PRESENTATION */
        .about-wrapper {
            max-width: 1100px;
            margin: 20px auto 60px auto;
            padding: 0 25px;
            width: 100%;
        }

        .profile-card {
            background: linear-gradient(145deg, #121815 0%, #0a0d0c 100%);
            border: 1px solid rgba(229, 184, 105, 0.25);
            border-radius: 24px;
            padding: 60px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: row;
            gap: 60px;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .profile-img-container {
            flex: 0 0 380px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .profile-img-container img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 25px rgba(229, 184, 105, 0.25));
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        .profile-img-container img:hover {
            filter: drop-shadow(0 15px 35px rgba(229, 184, 105, 0.4));
            transform: scale(1.02);
        }

        .about-content {
            flex: 1;
        }

        .about-title {
            font-size: 2.5rem;
            color: #FFFFFF;
            letter-spacing: 5px;
            margin-bottom: 25px;
            font-weight: 800;
            position: relative;
            padding-bottom: 12px;
        }

        .about-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 2px;
            background: #E5B869;
        }

        .about-text {
            font-size: 1.15rem;
            color: #E2E8F0;
            letter-spacing: 1.5px;
            font-style: normal;
            line-height: 2;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid rgba(40, 54, 47, 0.6);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .copyright {
            color: #64748B;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* MEDIA QUERIES : OPTIMISATION MOBILE */
        @media (max-width: 850px) {
            body {
                padding-top: 80px;
            }

            .top-nav {
                padding: 15px 25px;
            }

            .menu-toggle {
                display: block;
            }

            .nav-container {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(12, 15, 14, 0.98);
                padding: 25px 0;
                gap: 20px;
                border-bottom: 1px solid rgba(229, 184, 105, 0.4);
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            }

            .nav-container.active {
                display: flex;
            }

            .profile-card {
                flex-direction: column;
                gap: 30px;
                padding: 40px 20px;
                border-radius: 16px;
            }

            .profile-img-container {
                flex: 0 0 auto;
                max-width: 260px;
            }

            .about-title {
                text-align: center;
                font-size: 1.8rem;
                letter-spacing: 3px;
            }

            .about-title::after {
                left: 50%;
                transform: translateX(-50%);
            }

            .about-text {
                text-align: center;
                font-size: 1rem;
                letter-spacing: 1px;
                line-height: 1.8;
            }

            .about-content {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>
            <div class="nav-container" id="navContainer">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link active">About</a>
                <a href="index.html#gallery" class="nav-link">Gallery</a>
                <a href="index.html#muse" class="nav-link">Muse</a>
                <a href="index.html#melodies" class="nav-link">Melodies</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <main class="about-wrapper">
        <div class="profile-card">
            <div class="profile-img-container">
                <img src="images/autoportrait.webp" alt="Nosakhare">
            </div>
            <div class="about-content">
                <h1 class="about-title">NOSAKHARE</h1>
                <p class="about-text">
                    Hi my name is Nosakhare, welcome to my open codex. I seek to express visions beneath the clamor of a restless world. I have made a covenant to never betray the truth I find within this sacred endeavour
                </p>
            </div>
        </div>
    </main>

    <footer>
        <div class="copyright">
            &copy; 2026 DECIPHART — All rights reserved.
        </div>
    </footer>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navContainer = document.getElementById('navContainer');

        menuToggle.addEventListener('click', () => {
            navContainer.classList.toggle('active');
            menuToggle.textContent = navContainer.classList.contains('active') ? '✕' : '☰';
        });
    </script>

</body>
</html>
