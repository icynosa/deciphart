<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About — DECIPHART</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cinzel', serif;
            background-color: #0c0f0e;
            color: #F1F5F9;
            line-height: 1.8;
            padding-top: 110px;
            background-image: radial-gradient(circle at 50% 0%, #151c19 0%, #0c0f0e 70%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(12, 15, 14, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(229, 184, 105, 0.4);
            z-index: 9999;
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .nav-link {
            color: #F1F5F9;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: #E5B869;
            text-shadow: 0 0 10px rgba(229, 184, 105, 0.6);
        }

        .about-wrapper {
            max-width: 1100px;
            margin: 20px auto 60px auto;
            padding: 0 25px;
            width: 100%;
        }

        .profile-card {
            background: linear-gradient(145deg, #121815 0%, #0a0d0c 100%);
            border: 1px solid rgba(229, 184, 105, 0.25);
            border-radius: 24px;
            padding: 50px 60px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: row;
            gap: 60px;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* INTEGRATION PHOTO SANS BORDURE AVEC OMBRE DOREE */
        .profile-img-container {
            flex: 0 0 380px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .profile-img-container img {
            width: 100%;
            height: auto;
            display: block;
            /* Halo lumineux subtil autour du détourage */
            filter: drop-shadow(0 10px 25px rgba(229, 184, 105, 0.25));
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        .profile-img-container img:hover {
            filter: drop-shadow(0 15px 35px rgba(229, 184, 105, 0.4));
            transform: scale(1.02);
        }

        .about-content {
            flex: 1;
        }

        .about-title {
            font-size: 2.5rem;
            color: #FFFFFF;
            letter-spacing: 5px;
            margin-bottom: 25px;
            font-weight: 800;
            position: relative;
            padding-bottom: 12px;
        }

        .about-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 2px;
            background: #E5B869;
        }

        .about-text {
            font-size: 1.15rem;
            color: #E2E8F0;
            letter-spacing: 1.5px;
            font-style: italic;
            line-height: 2;
            margin-bottom: 35px;
        }

        /* BOUTON LECTEUR MUSIC */
        .audio-btn {
            background: rgba(229, 184, 105, 0.1);
            border: 1px solid #E5B869;
            color: #E5B869;
            padding: 12px 28px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .audio-btn:hover {
            background: #E5B869;
            color: #0c0f0e;
            box-shadow: 0 0 20px rgba(229, 184, 105, 0.4);
        }

        /* IFRAME CACHEE POUR YOUTUBE AUDIO */
        .youtube-hidden {
            position: absolute;
            width: 0;
            height: 0;
            border: 0;
            opacity: 0;
            pointer-events: none;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid rgba(40, 54, 47, 0.6);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .copyright {
            color: #64748B;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        @media (max-width: 900px) {
            .profile-card {
                flex-direction: column;
                gap: 40px;
                padding: 40px 25px;
            }
            .profile-img-container {
                flex: 0 0 auto;
                max-width: 280px;
            }
            .about-title {
                text-align: center;
                font-size: 2rem;
            }
            .about-title::after {
                left: 50%;
                transform: translateX(-50%);
            }
            .about-text {
                text-align: center;
                font-size: 1.05rem;
            }
            .about-content {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link active">About</a>
            <a href="index.html#gallery" class="nav-link">Gallery</a>
            <a href="index.html#muse" class="nav-link">Muse</a>
            <a href="index.html#melodies" class="nav-link">Melodies</a>
            <a href="index.html#contact" class="nav-link">Contact</a>
        </div>
    </nav>

    <main class="about-wrapper">
        <div class="profile-card">
            <div class="profile-img-container">
                <img src="images/autoportrait.webp" alt="Nosakhare">
            </div>
            <div class="about-content">
                <h1 class="about-title">NOSAKHARE</h1>
                <p class="about-text">
                    "Hi my name is Nosakhare, welcome to my open codex. I seek to express visions beneath the clamor of a restless world. I have made a covenant to never betray the truth I find within this sacred endeavour"
                </p>
                <button class="audio-btn" id="musicToggle">
                    <span>♫</span> <span id="musicText">Play Atmosphere</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Lecteur YouTube pour la musique Fly de Ludovico Einaudi -->
    <div class="youtube-hidden" id="ytPlayerContainer"></div>

    <footer>
        <div class="copyright">
            &copy; 2026 DECIPHART — All rights reserved.
        </div>
    </footer>

    <!-- Script API YouTube pour contrôle garanti de la musique -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let isPlaying = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayerContainer', {
                height: '0',
                width: '0',
                videoId: '3e2o1B745zM', // Fly - Ludovico Einaudi
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': '3e2o1B745zM'
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            const btn = document.getElementById('musicToggle');
            const btnText = document.getElementById('musicText');

            btn.addEventListener('click', () => {
                if (!isPlaying) {
                    player.playVideo();
                    btnText.textContent = "Pause Atmosphere";
                    isPlaying = true;
                } else {
                    player.pauseVideo();
                    btnText.textContent = "Play Atmosphere";
                    isPlaying = false;
                }
            });
        }
    </script>

</body>
</html>
